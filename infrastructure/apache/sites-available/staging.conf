# ELRT staging reverse proxy.
# Backend: e-lrt-app:80 on shared-network.
#
# Add another app by copying this pattern inside the VirtualHost:
# RewriteRule ^/app-a$ /app-a/ [R=301,L]
# ProxyPass        /app-a/ http://app-a:80/ connectiontimeout=60 timeout=120
# ProxyPassReverse /app-a/ http://app-a:80/
#
# The new container must join shared-network and support the /app-a/ base path.

<VirtualHost *:80>
    ServerName stg.pelita-air.com

    CustomLog /proc/self/fd/1 combined
    ErrorLog  /proc/self/fd/2

    LimitRequestBody 52428800

    RewriteEngine On

    # Redirect /elrt to /elrt/.
    RewriteRule ^/elrt$ /elrt/ [R=301,L]

    # TLS terminates at the load balancer.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        /elrt/ http://e-lrt-app:80/ connectiontimeout=60 timeout=120
    ProxyPassReverse /elrt/ http://e-lrt-app:80/
</VirtualHost>
