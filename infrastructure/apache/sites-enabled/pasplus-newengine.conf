########################################################################
# pasplus-newengine - Reverse Proxy Configuration
#
# Backend container harus berada di shared-network dan listen HTTP port 80.
# Sesuaikan hostname backend jika nama container app berbeda.
########################################################################

<VirtualHost *:80>
    ServerName pasplus-newengine.local

    CustomLog /proc/self/fd/1 combined
    ErrorLog  /proc/self/fd/2

    ProxyPass        / http://pasplus-newengine-app:80/
    ProxyPassReverse / http://pasplus-newengine-app:80/

    # TLS terminates at the trusted load balancer before this HTTP origin.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
