ServerRoot "/usr/local/apache2"
Listen 80
Listen 127.0.0.1:8083

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so

ServerName localhost
ServerTokens Prod
ServerSignature Off

User daemon
Group daemon

DirectoryIndex index.html
TypesConfig conf/mime.types

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined
ErrorLog /proc/self/fd/2
LogLevel warn

ProxyRequests Off
ProxyPreserveHost On

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Reject unknown public hosts instead of forwarding to an app.
<VirtualHost *:80>
    ServerName default.invalid
    <Location />
        Require all denied
    </Location>
</VirtualHost>

<VirtualHost 127.0.0.1:8083>
    ServerName health.local
    DocumentRoot "/usr/local/apache2/health"
    <Directory "/usr/local/apache2/health">
        Require all granted
    </Directory>
</VirtualHost>

IncludeOptional conf/sites-enabled/*.conf
