########################################################################
# Global Reverse Proxy Defaults
########################################################################

proxy_http_version 1.1;

# Timeouts
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

# Buffering
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;