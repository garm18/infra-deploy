########################################################################
# Global Performance / Compression Policy
########################################################################

# File / TCP handling
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# Keepalive
keepalive_timeout 65;

# MIME hash
types_hash_max_size 2048;

# Compression
gzip on;
gzip_vary on;
gzip_proxied any;

gzip_comp_level 5;
gzip_min_length 1024;

gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff2;