# MinIO needs two hostnames: one for the S3 API and one for the Console GUI.
# Replace both example domains, set MINIO_BROWSER_REDIRECT_URL to the Console URL,
# then enable this file under sites-enabled/.

upstream minio_s3_backend {
    zone minio_s3_backend 64k;
    server minio-storage:9000 resolve;
    keepalive 32;
}

upstream minio_console_backend {
    zone minio_console_backend 64k;
    server minio-storage:9001 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name s3.example.com;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 300s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://minio_s3_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 300s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://minio_console_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
