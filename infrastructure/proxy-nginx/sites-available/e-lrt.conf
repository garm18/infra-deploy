########################################################################
# E-LRT — Reverse Proxy Configuration
#
# Meneruskan HTTP traffic dari reverse proxy ke container e-lrt-app.
# Container e-lrt-app punya Nginx internal (PHP-FPM gateway) + PHP-FPM.
#
# Arsitektur:
#   Client → proxy-nginx:80 → e-lrt-app:80 (nginx internal) → php-fpm:9000
#
# Nginx di dalam app container BUKAN reverse proxy — melainkan FastCGI
# gateway yang menerjemahkan HTTP ke protokol FastCGI untuk PHP-FPM.
#
# Production: ganti server_name dengan domain asli.
# Local: akses via http://localhost:8080
########################################################################

upstream elrt_backend {
    zone elrt_backend 64k;
    server e-lrt-app:80 resolve;
}

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain production Anda
    # Untuk local testing, "localhost" dan "_" sudah cukup
    server_name localhost;

    # ── Logging (per-app) ──────────────────────────────────────────
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # ── Proxy ke app container ─────────────────────────────────────
    location / {
        proxy_pass         http://elrt_backend;
        proxy_http_version 1.1;

        # Forward client info ke app
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # WebSocket support (jika diperlukan untuk broadcasting)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer settings
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         4 32k;
        proxy_busy_buffers_size 64k;
    }

    # ── Health check endpoint untuk monitoring ─────────────────────
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

