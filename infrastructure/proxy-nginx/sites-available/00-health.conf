########################################################################
# Internal Nginx Health Check
#
# Accessible only from inside the container.
########################################################################

server {
    listen 127.0.0.1:8081;

    server_name _;

    access_log off;

    location = /healthz {
        default_type text/plain;

        return 200 "OK\n";
    }

    location / {
        return 404;
    }
}