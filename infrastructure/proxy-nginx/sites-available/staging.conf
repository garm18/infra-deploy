########################################################################
# Staging Reverse Proxy
# Domain : stg2.pelita-air.com
# HTTP   : host 8080 -> container 80
# HTTPS  : host 8443 -> container 443
# Network: shared-network
########################################################################

# --- Upstreams --------------------------------------------------------

upstream lostnfound_frontend {
    zone lostnfound_frontend 64k;
    server lostnfound-frontend:8080 resolve;
    keepalive 16;
}

# Laravel is intentionally not a public upstream. Requests for /api,
# /sanctum, and /storage pass through the frontend Nginx to the private
# lostnfound-internal network.

# --- HTTP -------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name stg2.pelita-air.com;

    # Staging landing page.
    location = / {
        access_log off;
        default_type application/json;
        return 200 '{"environment":"staging","status":"ready"}\n';
    }

    # Lost & Found frontend.
    location = /lostnfound {
        return 301 /lostnfound/;
    }

    location ^~ /lostnfound/ {
        # Trailing slash strips /lostnfound/ before forwarding.
        proxy_pass http://lostnfound_frontend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;

        # TLS terminates at AWS ALB; origin traffic arrives over HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Nuxt static routes such as /admin are directories in the frontend
        # image. Nginx redirects them to /admin/ using its internal port 8080;
        # translate that Location header back to the public staging base path.
        proxy_redirect ~^http://[^/]+:8080(/.*)$ https://$host/lostnfound$1;
    }

    # AWS ALB health check.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Reject unregistered staging paths.
    location / {
        return 404;
    }
}

# --- HTTPS ------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stg2.pelita-air.com;

    ssl_certificate     /etc/nginx/ssl/bintang.pelita-air.pem;
    ssl_certificate_key /etc/nginx/ssl/pelita.key;

    # Staging landing page.
    location = / {
        access_log off;
        default_type application/json;
        return 200 '{"environment":"staging","status":"ready"}\n';
    }

    # Lost & Found frontend.
    location = /lostnfound {
        return 301 /lostnfound/;
    }

    location ^~ /lostnfound/ {
        proxy_pass http://lostnfound_frontend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect ~^http://[^/]+:8080(/.*)$ https://$host/lostnfound$1;
    }

    # HTTPS health check.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Reject unregistered staging paths.
    location / {
        return 404;
    }
}
