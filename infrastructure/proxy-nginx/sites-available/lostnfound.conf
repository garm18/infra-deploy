########################################################################
# Lost & Found staging — one public entry point for Nuxt and Laravel.
#
# TLS terminates at the ALB. This Nginx receives HTTP internally, but always
# passes the original public scheme and port to the application.
########################################################################

upstream lostnfound_frontend {
    zone lostnfound_frontend 64k;
    server lostnfound-frontend:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stg2.pelita-air.com;

    access_log /dev/stdout main;
    error_log /dev/stderr warn;
    client_max_body_size 100m;

    # Normalise the public base path, then strip it before forwarding to the
    # static Nuxt container. Nuxt must be built with /lostnfound/ as baseURL.
    location = /lostnfound {
        return 301 /lostnfound/;
    }

    location ^~ /lostnfound/ {
        proxy_pass http://lostnfound_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        # Rewrite static-directory redirects generated by the internal Nginx
        # so clients retain the public /lostnfound base path and HTTPS port.
        proxy_redirect ~^http://[^/]+:8080(/.*)$ https://$host/lostnfound$1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
