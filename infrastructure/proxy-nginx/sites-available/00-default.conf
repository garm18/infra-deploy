########################################################################
# Default / Catch-All Virtual Host
#
# AWS ALB:
#   Target protocol : HTTP
#   Host port       : 8080
#   Container port  : 80
#   Health path     : /nginx-health
#   Success code    : 200
########################################################################

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # AWS ALB health check
    location = /nginx-health {
        access_log off;
        default_type text/plain;

        return 200 "OK\n";
    }

    # Reject unknown hosts
    location / {
        return 444;
    }
}