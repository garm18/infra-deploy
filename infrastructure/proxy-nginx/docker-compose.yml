# Centralized NGINX reverse proxy
#
# Host ports:
#   8080 -> NGINX HTTP  :80
#   8443 -> NGINX HTTPS :443
#
# Restrict ingress using AWS Security Group / firewall.

services:
  proxy-nginx:
    image: nginx:1.27-alpine
    container_name: proxy-nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

    init: true

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # Main configuration
      - ./conf.d:/etc/nginx/conf.d:ro   # Global policies
      - ./sites-available:/etc/nginx/sites-available:ro   # Virtual hosts
      - ./sites-enabled:/etc/nginx/sites-enabled:ro
      - ./ssl:/etc/nginx/ssl:ro   # TLS certificates

    networks:
      - shared-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8081/healthz"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  shared-network:
    external: true